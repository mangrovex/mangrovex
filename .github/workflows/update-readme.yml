name: Actualizar README

on:
  schedule:
    - cron: "23 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar la sección de repositorios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nada que publicar."
          else
            git commit -m "Actualiza repositorios recientes"
            git push
          fi
